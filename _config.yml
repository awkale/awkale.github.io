name: Alex W. Kale

# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Alex W. Kale
email: hi@awkale.me
description: > # this means to ignore newlines until "baseurl:"
  Portfolio site for Alex W. Kale
url: 'http://awkale.me' # the base hostname & protocol for your site
twitter_username: awkale
github_username: awkale

collections:
  cheatsheets:
    output: true
  portfolios:
    output: true

permalink: pretty

# Repo working files, not site content. Without this Jekyll copies them into
# _site verbatim and Pages serves them at awkale.me (e.g. /docs/adr/...).
exclude:
  - AGENTS.md
  - CONTEXT.md
  - docs
  - scripts

# Build settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
